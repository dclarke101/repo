<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #22c55e 0%, #ff8c42 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .status {
            color: #22c55e;
            font-size: 1.2em;
            margin-bottom: 30px;
            height: 30px;
            font-weight: 600;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .cell {
            width: 120px;
            height: 120px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 3em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell:hover:not(.disabled) {
            background: #e0e0e0;
            transform: scale(1.05);
        }

        .cell.x {
            color: #22c55e;
        }

        .cell.o {
            color: #ff8c42;
        }

        .cell.disabled {
            cursor: not-allowed;
        }

        button {
            background: linear-gradient(135deg, #22c55e 0%, #ff8c42 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .info {
            margin-top: 20px;
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <div class="status" id="status">Your turn (X)</div>
        <div class="board" id="board"></div>
        <button onclick="resetGame()">New Game</button>
        <div class="info">
            <p>You are <strong style="color: #22c55e;">X</strong>, Computer is <strong style="color: #ff8c42;">O</strong></p>
        </div>
    </div>

    <script>
        const board = Array(9).fill(null);
        let isGameOver = false;
        let isPlayerTurn = true;

        function createBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            board.forEach((cell, index) => {
                const cellEl = document.createElement('div');
                cellEl.className = 'cell';
                if (cell === 'X') cellEl.classList.add('x');
                if (cell === 'O') cellEl.classList.add('o');
                cellEl.textContent = cell || '';
                cellEl.onclick = () => playerMove(index);
                boardEl.appendChild(cellEl);
            });
        }

        function playerMove(index) {
            if (board[index] || isGameOver || !isPlayerTurn) return;
            board[index] = 'X';
            isPlayerTurn = false;
            createBoard();
            checkGameState();
            if (!isGameOver) {
                setTimeout(computerMove, 500);
            }
        }

        function computerMove() {
            const bestMove = minimax(board, 'O').index;
            board[bestMove] = 'O';
            createBoard();
            isPlayerTurn = true;
            checkGameState();
        }

        function minimax(currentBoard, player) {
            const emptySquares = currentBoard.map((val, idx) => val === null ? idx : null).filter(val => val !== null);

            if (checkWinner(currentBoard, 'X')) return { score: -10 };
            if (checkWinner(currentBoard, 'O')) return { score: 10 };
            if (emptySquares.length === 0) return { score: 0 };

            let best = player === 'O' ? { score: -Infinity } : { score: Infinity };

            emptySquares.forEach(index => {
                currentBoard[index] = player;
                const score = minimax(currentBoard, player === 'O' ? 'X' : 'O').score;
                currentBoard[index] = null;

                if (player === 'O') {
                    if (score > best.score) best = { index, score };
                } else {
                    if (score < best.score) best = { index, score };
                }
            });

            return best;
        }

        function checkWinner(currentBoard, player) {
            const winning = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],
                [2, 4, 6]
            ];
            return winning.some(combo => combo.every(i => currentBoard[i] === player));
        }

        function checkGameState() {
            if (checkWinner(board, 'X')) {
                document.getElementById('status').textContent = '🎉 You win!';
                isGameOver = true;
            } else if (checkWinner(board, 'O')) {
                document.getElementById('status').textContent = '🤖 Computer wins!';
                isGameOver = true;
            } else if (board.every(cell => cell !== null)) {
                document.getElementById('status').textContent = "It's a draw!";
                isGameOver = true;
            } else {
                document.getElementById('status').textContent = isPlayerTurn ? 'Your turn (X)' : 'Computer is thinking...';
            }
        }

        function resetGame() {
            board.fill(null);
            isGameOver = false;
            isPlayerTurn = true;
            createBoard();
            document.getElementById('status').textContent = 'Your turn (X)';
        }

        createBoard();
    </script>
</body>
</html>
