<div class="container">
  <h1>🎵 Playlist Manager</h1>

  <div *ngIf="error" class="error">{{ error }}</div>

  <div class="controls">
    <select class="sort-dropdown" [(ngModel)]="currentSort" (change)="onSortChange()">
      <option value="">Default Order</option>
      <option value="title">Sort by Title</option>
      <option value="artist">Sort by Artist</option>
    </select>
    <button (click)="openAddModal()">+ Add Song</button>
  </div>

  <div *ngIf="loading" class="loading">Loading songs...</div>

  <div *ngIf="!loading">
    <div *ngIf="songs.length === 0" class="no-songs">
      No songs yet. Add one to get started!
    </div>

    <table *ngIf="songs.length > 0" class="songs-table">
      <thead>
        <tr>
          <th>Title</th>
          <th>Artist</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let song of songs">
          <td>{{ song.title }}</td>
          <td>{{ song.artist }}</td>
          <td class="action-buttons">
            <button class="secondary" (click)="openEditModal(song)">Edit</button>
            <button class="danger" (click)="deleteSong(song.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Add Song Modal -->
  <div class="modal" [class.active]="modalVisible">
    <div class="modal-content">
      <h2>Add New Song</h2>
      <div class="form-group">
        <label>Title</label>
        <input type="text" [(ngModel)]="newSong.title" placeholder="Enter song title">
      </div>
      <div class="form-group">
        <label>Artist</label>
        <input type="text" [(ngModel)]="newSong.artist" placeholder="Enter artist name">
      </div>
      <div class="modal-buttons">
        <button (click)="closeAddModal()">Cancel</button>
        <button (click)="addSong()">Add Song</button>
      </div>
    </div>
  </div>

  <!-- Edit Song Modal -->
  <div class="modal" [class.active]="editModalVisible">
    <div class="modal-content">
      <h2>Edit Song</h2>
      <div *ngIf="editingSong" class="form-group">
        <label>Title</label>
        <input type="text" [(ngModel)]="editingSong.title" placeholder="Enter song title">
      </div>
      <div *ngIf="editingSong" class="form-group">
        <label>Artist</label>
        <input type="text" [(ngModel)]="editingSong.artist" placeholder="Enter artist name">
      </div>
      <div class="modal-buttons">
        <button (click)="closeEditModal()">Cancel</button>
        <button (click)="updateSong()">Update Song</button>
      </div>
    </div>
  </div>
</div>
